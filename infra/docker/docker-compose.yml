# Supporting services only. The database is the owner's local Microsoft SQL Server (ADR-0004); it is not run here.
name: nms
services:
  redis:
    image: redis:7.2
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:?set in .env}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?set in .env}"
    ports: ["5672:5672", "15672:15672"]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, timeout: 10s, retries: 10 }
  s3:
    # MinIO no longer publishes free container images; SeaweedFS is a local-dev S3-compatible stand-in (ADR-0002).
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.port=8333 -dir=/data
    ports: ["9000:8333", "9333:9333"]
    volumes: [s3data:/data]
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["1025:1025", "8025:8025"]
volumes:
  s3data: {}
